# Netlify configuration for the Uni-Learn landing site.
#
# next.config.mjs sets `output: 'export'`, so this is a fully static site:
# `next build` emits the complete site into `out/` and Netlify serves it
# directly. The Next.js Runtime / OpenNext adapter is not required.
# https://docs.netlify.com/build/frameworks/framework-setup-guides/nextjs/overview/

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 15 requires Node >= 18.18.
  NODE_VERSION = "20"

# Hashed build assets are content-addressed, so they can be cached forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Downloadable app packages (.wgt and friends): save to disk instead of
# letting the browser try to render them inline.
[[headers]]
  for = "/downloads/*"
  [headers.values]
    Content-Disposition = "attachment"
